name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm and Rust tools
        run: |
          npm install --global npm@12.1.0 --ignore-scripts
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc --version
          node --version
          npm --version
      - name: Install Linux build and native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check formatting
        run: |
          npm run format:check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test frontend and data calculations
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Test and lint Rust backend
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build release desktop application
        run: npm run tauri:build -- --ci
      - name: Install pinned external WebDriver bridge
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Test native Tauri window and real IPC with synthetic logs
        run: xvfb-run -a npm run test:native
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
